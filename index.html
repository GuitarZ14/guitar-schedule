/* ===== init ===== */
function init(){
  load();
  weekStart=mondayOf(todayStr());
  dayCursor=todayStr();
  currentMonth=ymStr(new Date());
  // 侧栏导航 + 移动端底栏（共用 data-tab）
  document.querySelectorAll('[data-tab]').forEach(b=>{
    if(b.classList.contains('nav-item')||b.closest('.bottomnav')){
      b.onclick=()=>{ currentTab=b.dataset.tab; closeSidebar(); render(); };
    }
  });
  // 周 / 日 视图切换
  document.querySelectorAll('#viewToggle button').forEach(b=>b.onclick=()=>{
    viewMode=b.dataset.mode; if(!dayCursor) dayCursor=todayStr();
    document.querySelectorAll('#viewToggle button').forEach(x=>x.classList.toggle('active',x===b));
    render();
  });
  // 日期导航（周视图翻周 / 日视图翻天）
  document.getElementById('navPrev').onclick=()=>{
    if(viewMode==='week'){ weekStart=ymd(addDays(parseYMD(weekStart),-7)); } else { dayCursor=ymd(addDays(parseYMD(dayCursor),-1)); } render();
  };
  document.getElementById('navNext').onclick=()=>{
    if(viewMode==='week'){ weekStart=ymd(addDays(parseYMD(weekStart),7)); } else { dayCursor=ymd(addDays(parseYMD(dayCursor),1)); } render();
  };
  document.getElementById('navToday').onclick=()=>{ weekStart=mondayOf(todayStr()); dayCursor=todayStr(); render(); };
  // 顶部筛选（按学员）
  document.getElementById('filterStudent').onchange=e=>{ filterStudent=e.target.value; render(); };
  // 顶部新增课程
  document.getElementById('topAdd').onclick=()=>openCourseModal(null);
  // 移动端侧栏抽屉
  document.getElementById('menuBtn').onclick=()=>{ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('show'); };
  document.getElementById('sidebarBackdrop').onclick=closeSidebar;
  document.getElementById('btnExport').onclick=exportJson;
  document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
  document.getElementById('fileImport').onchange=e=>{ if(e.target.files[0]) importJson(e.target.files[0]); e.target.value=''; };
  document.getElementById('btnClear').onclick=clearAll;
  // 云端备份 / 恢复
  initCloud();
  document.getElementById('btnCloudBackup').onclick=backupToCloud;
  document.getElementById('btnCloudRestore').onclick=restoreFromCloud;
  // course modal events
  document.getElementById('courseSave').onclick=saveCourse;
  document.getElementById('courseCancel').onclick=closeCourseModal;
  document.getElementById('courseDelete').onclick=()=>{ if(editingCourseId) confirmDialog('确定删除这条课程？',()=>{ courses=courses.filter(c=>c.id!==editingCourseId); saveCourses(); closeCourseModal(); render(); }); };
  // 开始时间变动 → 自动推算结束时间（开始 + 默认时长）
  document.getElementById('fStart').addEventListener('change', function(){
    const endInput = document.getElementById('fEnd');
    if(this.value && !endInput.dataset.manual){
      endInput.value = addMinutes(this.value, DEFAULT_COURSE_DURATION);
    }
  });
  // 用户手动改过结束时间后，不再自动覆盖（除非重新改开始时间）
  document.getElementById('fEnd').addEventListener('change', function(){
    this.dataset.manual = '1';
  });
  document.getElementById('newStudentQuick').onclick=()=>{
    pendingReturnToCourse=true;  // 标记：保存学员后要回弹课程弹窗
    openStudentModal(null);
  };
  // student modal events
  document.getElementById('studentSave').onclick=saveStudent;
  document.getElementById('studentCancel').onclick=()=>{
    if(pendingReturnToCourse){
      pendingReturnToCourse=false;
      openCourseModal(editingCourseId||null);
    }else{
      closeStudentModal();
    }
  };
  // repeat modal events
  document.getElementById('repeatSave').onclick=generateRepeat;
  document.getElementById('repeatCancel').onclick=()=>closeModal('repeatModal');
  // 勾选/取消每周几时，动态显示对应时段行
  document.querySelectorAll('#rWeekdays input').forEach(cb=>cb.onchange=syncDayTimes);
  document.getElementById('studentDelete').onclick=()=>{ if(editingStudentId) confirmDialog('确定删除该学员？',()=>{ const id=editingStudentId; students=students.filter(s=>s.id!==id); courses=courses.filter(c=>c.studentId!==id); saveStudents(); saveCourses(); closeStudentModal(); render(); }); };
  // close modal on backdrop click (only for non-confirm modals)
  document.querySelectorAll('.modal').forEach(m=>{
    if(m.id!=='confirmModal'){
      m.addEventListener('click',e=>{ if(e.target===m) m.hidden=true; });
    }
  });
  // × 关闭按钮：点击任意弹窗的 × 关掉对应弹窗
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
  // ESC 关闭最上层弹窗
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ const open=[...document.querySelectorAll('.modal')].filter(m=>!m.hidden); if(open.length) open[open.length-1].hidden=true; }
  });
  render();
}
init();
